name: Service CI

on:
  pull_request:
    paths: ['service/**', '.github/workflows/service-ci.yml']
  push:
    branches: [main]
    paths: ['service/**', '.github/workflows/service-ci.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Validate data files (schema + cross-checks + dangling trust refs)
        # PUBLISHED_BASE_URL lets the live trust overlay's package references
        # be resolved against the last published PM snapshot. Unset (or
        # unreachable) they are reported unverified, not failed — see
        # src/pipeline/tools/validate-data.ts.
        run: npm run validate:data
        env:
          PUBLISHED_BASE_URL: ${{ vars.PUBLISHED_BASE_URL }}
      - name: Trust-file format check
        run: npm run format:vendors -- --check
      - name: Generated JSON Schemas are up to date
        run: |
          npm run generate:schemas
          git diff --exit-code data/*.schema.json || {
            echo '::error::data/*.schema.json is out of date — run: npm run generate:schemas'
            exit 1
          }
      - name: Build smoke (pipeline on fixture + site)
        run: npm run build
