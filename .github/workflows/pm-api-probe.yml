name: PackageMaven API probe

# Temporary evaluation harness: fetches PackageMaven API endpoints from an
# Actions runner (which holds PACKAGE_MAVEN_TOKEN) and prints responses to the
# job log so the API can be compared against docs/packagemaven-data-contract.md.
# Manual-only; remove once the real fetcher integration lands.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Space-separated URL paths to fetch (relative to https://package-maven.com)'
        required: false
        default: '/api/docs'
      max_bytes:
        description: 'Max response bytes to print per request'
        required: false
        default: '60000'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch endpoints
        env:
          PM_TOKEN: ${{ secrets.PACKAGE_MAVEN_TOKEN }}
          PATHS: ${{ inputs.paths }}
          MAX_BYTES: ${{ inputs.max_bytes }}
        run: |
          set -u
          UA="mage-os-directory-eval (github.com/rhoerr/mage-os.directory; rhoerr@users.noreply.github.com)"
          for p in $PATHS; do
            url="https://package-maven.com${p}"
            echo "===================================================================="
            echo "== GET $url (Authorization: Bearer <token>, Accept: application/json)"
            echo "===================================================================="
            curl -sS --max-time 60 -D /tmp/h.txt \
              -H "Authorization: Bearer $PM_TOKEN" \
              -H "Accept: application/json" \
              -H "User-Agent: $UA" \
              "$url" -o /tmp/body.bin || echo "(curl failed)"
            cat /tmp/h.txt
            echo "-- body (first $MAX_BYTES bytes) --"
            head -c "$MAX_BYTES" /tmp/body.bin; echo
            echo
          done
