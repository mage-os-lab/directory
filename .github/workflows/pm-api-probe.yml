name: PackageMaven API probe

# Temporary evaluation harness: fetches PackageMaven API endpoints from an
# Actions runner (which holds PACKAGE_MAVEN_TOKEN) and prints responses to the
# job log so the API can be compared against docs/packagemaven-data-contract.md.
# Manual-only; remove once the real fetcher integration lands.

on:
  push:
    branches:
      - 'claude/package-maven-api-review-m9993e'
      - 'claude/mage-os-directory-integration-plerc2'
    paths: ['.github/pm-probe-paths.txt', '.github/workflows/pm-api-probe.yml']
  workflow_dispatch:
    inputs:
      paths:
        description: 'Space-separated URL paths to fetch (relative to https://package-maven.com)'
        required: false
        default: ''
      max_bytes:
        description: 'Max response bytes to print per request'
        required: false
        default: '60000'

jobs:
  # End-to-end check of the real fetcher: run the pipeline in live mode
  # against the PM API (no deploy) and summarize what it emitted.
  pipeline-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline against the live PM API
        env:
          PACKAGE_MAVEN_TOKEN: ${{ secrets.PACKAGE_MAVEN_TOKEN }}
        run: npx tsx src/pipeline/run.ts --source live --out /tmp/pm-live-out
      - name: Summarize emitted feed
        run: |
          python3 - <<'EOF'
          import collections, json
          feed = json.load(open('/tmp/pm-live-out/api/v1/feed.json'))
          pkgs = feed['packages']
          print(f"packages: {len(pkgs)}")
          print('tiers:', dict(collections.Counter(str(p['quality']['tier']) for p in pkgs)))
          cats = collections.Counter(c for p in pkgs for c in p['categories'])
          print('categories:', dict(cats.most_common()))
          print('with compatibility:', sum(1 for p in pkgs if p['compatibility']))
          print('with stars:', sum(1 for p in pkgs if p['popularity']['githubStars'] is not None))
          EOF

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch endpoints
        env:
          PM_TOKEN: ${{ secrets.PACKAGE_MAVEN_TOKEN }}
          INPUT_PATHS: ${{ inputs.paths }}
          MAX_BYTES: ${{ inputs.max_bytes || '400000' }}
        run: |
          set -u
          # Paths come from the dispatch input or, on push, from the committed list.
          PATHS="${INPUT_PATHS:-$(grep -v '^#' .github/pm-probe-paths.txt | tr '\n' ' ')}"
          UA="mage-os-directory-eval (github.com/rhoerr/mage-os.directory; rhoerr@users.noreply.github.com)"
          for p in $PATHS; do
            url="https://package-maven.com${p}"
            echo "===================================================================="
            echo "== GET $url (Authorization: Bearer <token>, Accept: application/json)"
            echo "===================================================================="
            curl -sS --max-time 60 -D /tmp/h.txt \
              -H "Authorization: Bearer $PM_TOKEN" \
              -H "Accept: application/json" \
              -H "User-Agent: $UA" \
              "$url" -o /tmp/body.bin || echo "(curl failed)"
            cat /tmp/h.txt
            echo "-- body (first $MAX_BYTES bytes) --"
            head -c "$MAX_BYTES" /tmp/body.bin; echo
            echo
          done
