name: Build & deploy

on:
  schedule:
    - cron: '23 5 * * *' # daily
  push:
    branches: [main]
    # The site and the embeddable bundle are both built from service/, so any change there ships.
    paths:
      - 'service/**'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source (live requires PACKAGE_MAVEN_TOKEN; fixture is the bootstrap path)'
        type: choice
        options: [live, fixture]
        default: live

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - name: Restore HTTP cache (ETags persist across ephemeral runners)
        uses: actions/cache@v4
        with:
          path: service/.cache/http
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Run pipeline
        env:
          PACKAGE_MAVEN_TOKEN: ${{ secrets.PACKAGE_MAVEN_TOKEN }}
          PM_API_URL: ${{ vars.PM_API_URL }}
          PUBLISHED_BASE_URL: ${{ vars.PUBLISHED_BASE_URL }}
          # READMEs and stars. The default Actions token is rate limited to
          # 1,000 REST requests/hour, which a *cold* cache can exhaust before
          # the corpus is covered (the run still succeeds, and the persisted
          # ETag cache lets the next one pick up where it stopped). Set the
          # README_GITHUB_TOKEN secret to a PAT (5,000/hour, no scopes needed
          # for public repositories) to cover a cold cache in one run.
          GITHUB_TOKEN: ${{ secrets.README_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline/run.ts --source "${{ inputs.source || 'live' }}" --out public
      - name: Build embeddable bundle (published at /embed/*)
        run: npm run build:ui
      - name: Build site
        # Origin and subpath come from astro.config.mjs; SITE_URL/BASE_PATH override
        # them for preview builds on another host.
        run: npx astro build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: service
          command: pages deploy dist --project-name=mage-os-directory
