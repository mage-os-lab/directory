name: Build & deploy

on:
  schedule:
    - cron: '23 5 * * *' # daily
  push:
    branches: [main]
    paths: ['service/data/**']
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source (live requires PACKAGE_MAVEN_TOKEN; fixture is the bootstrap path)'
        type: choice
        options: [live, fixture]
        default: live

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    # pages/id-token are only exercised on the GitHub Pages fallback path.
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      # Cloudflare Pages is the canonical host; until its secrets exist,
      # fall back to GitHub Pages (a project site, served from /<repo>/).
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - name: Restore HTTP cache (ETags persist across ephemeral runners)
        uses: actions/cache@v4
        with:
          path: service/.cache/http
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Run pipeline
        env:
          PACKAGE_MAVEN_TOKEN: ${{ secrets.PACKAGE_MAVEN_TOKEN }}
          PM_API_URL: ${{ vars.PM_API_URL }}
          PUBLISHED_BASE_URL: ${{ vars.PUBLISHED_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline/run.ts --source "${{ inputs.source || 'live' }}" --out public
      - name: Build embeddable bundle (published at /embed/*)
        run: npm run build:ui
      - name: Build site
        env:
          SITE_URL: ${{ env.HAS_CLOUDFLARE == 'true' && 'https://mage-os-directory.pages.dev' || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ env.HAS_CLOUDFLARE == 'true' && '/' || format('/{0}', github.event.repository.name) }}
        run: npx astro build
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: service
          command: pages deploy dist --project-name=mage-os-directory
      - name: Configure GitHub Pages (fallback)
        if: env.HAS_CLOUDFLARE != 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact (fallback)
        if: env.HAS_CLOUDFLARE != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: service/dist
      - name: Deploy to GitHub Pages (fallback)
        if: env.HAS_CLOUDFLARE != 'true'
        id: gh-pages-deploy
        uses: actions/deploy-pages@v4
